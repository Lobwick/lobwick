    .jstat { font: 500 11px "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <pattern id="pois" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#ffffff"/>
      <circle cx="11" cy="11" r="4.5" fill="#e8384f"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="300" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <line x1="250" y1="20" x2="250" y2="280" stroke="#30363d" stroke-width="1"/>
  <line x1="500" y1="20" x2="500" y2="280" stroke="#30363d" stroke-width="1"/>
  <line x1="750" y1="20" x2="750" y2="280" stroke="#30363d" stroke-width="1"/>
  
    <g transform="translate(60.0, 36) scale(1.3)">
      <path d="M30,10 L40,0 L60,0 L70,10 L95,22 L83,42 L75,34 L75,96 L25,96 L25,34 L17,42 L5,22 Z" fill="#FFD700" stroke="undefined" stroke-width="1.5"/>
    </g>
    <text x="125" y="192" text-anchor="middle" class="jtitle" fill="#e6edf3">MAILLOT JAUNE</text>
