    </g>
    <text x="875" y="192" text-anchor="middle" class="jtitle" fill="#e6edf3">MAILLOT BLANC</text>
    <text x="875" y="212" text-anchor="middle" class="jholder" fill="#e6edf3">Meilleur jeune projet</text>
