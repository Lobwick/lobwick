    <text x="125" y="230" text-anchor="middle" class="jstat" fill="#8b949e">11 repos · 14 abonnés</text>
  
    <g transform="translate(310.0, 36) scale(1.3)">
      <path d="M30,10 L40,0 L60,0 L70,10 L95,22 L83,42 L75,34 L75,96 L25,96 L25,34 L17,42 L5,22 Z" fill="#2ecc40" stroke="undefined" stroke-width="1.5"/>
    </g>
    <text x="375" y="192" text-anchor="middle" class="jtitle" fill="#e6edf3">MAILLOT VERT</text>
