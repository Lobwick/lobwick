<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maillots distinctifs: classements GitHub de Félix Moulin">
  <style>
    .jtitle { font: 800 13px "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.04em; }
